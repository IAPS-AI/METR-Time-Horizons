name: Update Benchmark Data

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest benchmark data
        run: |
          curl -s https://metr.org/assets/benchmark_results_1_0.yaml -o benchmark_results_1_0.yaml
          curl -s https://metr.org/assets/benchmark_results_1_1.yaml -o benchmark_results_1_1.yaml

      - name: Check if data changed
        id: check
        run: |
          if git diff --quiet benchmark_results_1_0.yaml benchmark_results_1_1.yaml; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Write data status file
        run: |
          CHANGED=${{ steps.check.outputs.changed }}
          NOW=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          if [ "$CHANGED" = "true" ]; then
            # Data changed — update both timestamps
            echo "{\"lastChecked\":\"$NOW\",\"lastUpdated\":\"$NOW\",\"dataChanged\":true}" > data-status.json
          else
            # No change — preserve the existing lastUpdated, update lastChecked
            PREV_UPDATED=$(python3 -c "import json,sys; d=json.load(open('data-status.json')); print(d['lastUpdated'])" 2>/dev/null || echo "$NOW")
            echo "{\"lastChecked\":\"$NOW\",\"lastUpdated\":\"$PREV_UPDATED\",\"dataChanged\":false}" > data-status.json
          fi

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add data-status.json
          if [ "${{ steps.check.outputs.changed }}" = "true" ]; then
            git add benchmark_results_1_0.yaml benchmark_results_1_1.yaml
          fi
          git diff --cached --quiet || {
            git commit -m "Update benchmark data $(date -u +'%Y-%m-%d')"
            git push
          }
